<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Polls App{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'polls/style.css' %}">
</head>
<body>
    <div id="content">
        <h1>{% block header %}Polls{% endblock %}</h1>
        {% block content %}{% endblock %}
    </div>
    <div id="footer">
        <p>{% block footer %}Django Polls App - Tutorial{% endblock %}</p>
    </div>
</body>
</html>
